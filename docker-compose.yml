services:

  postgres:
    profiles: ["dev", "prod"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run "cp .env.example .env"}
      POSTGRES_USER: ${POSTGRES_USER:?Run "cp .env.example .env"}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run "cp .env.example .env"}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d crossfitbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432"

  # minio:
  #   profiles: ["dev", "prod"]
  #   image: dhi.io/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_USER:?Run "cp .env.example .env"}
  #     MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run "cp .env.example .env"}
  #   volumes:
  #     - minio_data:/data
  #   restart: unless-stopped

  mailpit:
    profiles: ["dev", "prod"]
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    profiles: ["prod"]
    image: ${BACKEND_IMAGE:-ghcr.io/crossfitbuddy/crossfit-buddy-backend}:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:?Run "cp .env.example .env"}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?Run "cp .env.example .env"}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      # minio:
      #   condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

  frontend:
    profiles: ["prod"]
    image: ${FRONTEND_IMAGE:-ghcr.io/crossfitbuddy/crossfit-buddy-frontend}:${IMAGE_TAG:-latest}
    volumes:
      - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro #перезапись nginx.conf фронта
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    profiles: ["prod"]
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
    